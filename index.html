<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMS Mobile & Dock Control</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0a0e] text-white font-sans antialiased pb-20">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [building, setBuilding] = React.useState(4);
        const [zone, setZone] = React.useState('DOCK'); // 'DOCK' o 'YARD'
        const [filter, setFilter] = React.useState('ALL'); // 'ALL', 'OCCUPIED', 'AVAILABLE', 'WORKING', 'DISCREPANCY', 'DISABLED'
        const [lang, setLang] = React.useState('ES');
        
        const [locations, setLocations] = React.useState(() => {
          const saved = localStorage.getItem('yms_app_v4');
          if (saved) return JSON.parse(saved);
          const locs = [];
          // Bodega 4 Docks (1-44) y Yardas (1-50)
          for (let i = 1; i <= 44; i++) {
            locs.push({ id: `B4-D-${i}`, building: 4, zone: 'DOCK', number: i, status: i === 3 ? 'OCCUPIED_LOADED' : i === 5 ? 'AVAILABLE' : i === 6 ? 'WORKING' : i === 7 ? 'DISCREPANCY' : i <= 4 ? 'DISABLED' : 'OCCUPIED_LOADED', trailer: i === 3 ? 'W019815' : i === 5 ? '' : i === 6 ? 'LT-101' : i === 7 ? 'C5397' : 'TRL-'+i, loadState: 'LOADED' });
          }
          for (let i = 1; i <= 50; i++) {
            locs.push({ id: `B4-Y-${i}`, building: 4, zone: 'YARD', number: i, status: i % 2 === 0 ? 'AVAILABLE' : 'OCCUPIED_LOADED', trailer: i % 2 === 0 ? '' : 'MX-'+i, loadState: 'EMPTY' });
          }
          // Bodega 5
          for (let i = 1001; i <= 1038; i++) {
            locs.push({ id: `B5-D-${i}`, building: 5, zone: 'DOCK', number: i, status: 'AVAILABLE', trailer: '', loadState: 'LOADED' });
          }
          return locs;
        });

        const [overflowList, setOverflowList] = React.useState([
          { id: 1, trailer: 'TRL-9912', pos: 'Frente a Rampa 5' },
          { id: 2, trailer: 'MX-2049', pos: 'Pasillo Central Yarda' }
        ]);
        const [editingLoc, setEditingLoc] = React.useState(null);
        const [overflowModal, setOverflowModal] = React.useState(false);

        React.useEffect(() => {
          localStorage.setItem('yms_app_v4', JSON.stringify(locations));
        }, [locations]);

        // Filtrar por Bodega y Zona actual
        const currentItems = locations.filter(l => l.building === building && l.zone === zone);

        // Métricas dinámicas
        const stats = {
          total: currentItems.length,
          available: currentItems.filter(l => l.status === 'AVAILABLE').length,
          occupied: currentItems.filter(l => l.status === 'OCCUPIED_LOADED' || l.status === 'OCCUPIED_EMPTY').length,
          working: currentItems.filter(l => l.status === 'WORKING').length,
          discrepancy: currentItems.filter(l => l.status === 'DISCREPANCY').length,
          disabled: currentItems.filter(l => l.status === 'DISABLED').length,
        };

        // Filtrar elementos según los botones inferiores
        const displayedItems = currentItems.filter(l => {
          if (filter === 'OCCUPIED') return l.status === 'OCCUPIED_LOADED' || l.status === 'OCCUPIED_EMPTY';
          if (filter === 'AVAILABLE') return l.status === 'AVAILABLE';
          if (filter === 'WORKING') return l.status === 'WORKING';
          if (filter === 'DISCREPANCY') return l.status === 'DISCREPANCY';
          if (filter === 'DISABLED') return l.status === 'DISABLED';
          return true; // ALL
        });

        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const trailer = fd.get('trailer').trim().toUpperCase();
          const status = fd.get('status');
          const loadState = fd.get('loadState');

          const updated = locations.map(l => l.id === editingLoc.id ? { ...l, trailer, status, loadState } : l);
          setLocations(updated);
          setEditingLoc(null);
        };

        return (
          <div className="min-h-screen bg-[#0b0a0e] text-white p-3 max-w-md mx-auto space-y-3 font-sans">
            
            {/* Header Superior */}
            <div className="flex items-center justify-between bg-[#151221] p-3 rounded-2xl border border-purple-900/40 shadow-lg">
              <div className="flex items-center gap-2.5">
                <div className="bg-[#261f3f] p-2 rounded-xl border border-purple-500/30 text-purple-300">
                  🚛
                </div>
                <span className="font-extrabold text-lg tracking-tight">YMS Mobile</span>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={() => setBuilding(building === 4 ? 5 : 4)} className="bg-[#1f1a30] px-2.5 py-1.5 rounded-xl text-xs font-bold text-purple-300 border border-purple-800">
                  Bodega {building}
                </button>
                <button onClick={() => setLang(lang === 'ES' ? 'EN' : 'ES')} className="bg-[#1f1a30] px-2.5 py-1.5 rounded-xl text-xs font-bold text-purple-300 border border-purple-800">
                  {lang}
                </button>
              </div>
            </div>

            {/* Switch Central: Rampas / Yarda */}
            <div className="bg-[#151221] p-2.5 rounded-2xl border border-purple-900/40 flex items-center justify-between text-xs font-extrabold">
              <span className={`${zone === 'DOCK' ? 'text-white' : 'text-zinc-400'} transition`}>RAMPAS / DOCKS</span>
              <button 
                onClick={() => setZone(zone === 'DOCK' ? 'YARD' : 'DOCK')} 
                className="w-16 h-8 bg-[#231b3b] border border-purple-600/50 rounded-full p-1 flex items-center transition shadow-inner"
                style={{ justifyContent: zone === 'YARD' ? 'flex-end' : 'flex-start' }}
              >
                <div className="w-6 h-6 bg-purple-600 rounded-full shadow-md"></div>
              </button>
              <span className={`${zone === 'YARD' ? 'text-white' : 'text-zinc-400'} transition`}>YARDA / PATIO</span>
            </div>

            {/* Sección de Sobreflujo */}
            <div className="flex gap-2">
              <div className="flex-1 bg-[#1a1424] border border-amber-500/40 p-2.5 rounded-2xl text-amber-400 font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                ⚠️ SOBREFLUJO ({overflowList.length})
              </div>
              <button onClick={() => setOverflowModal(true)} className="bg-purple-600 hover:bg-purple-500 px-4 py-2.5 rounded-2xl font-bold text-xs shadow-lg shadow-purple-600/30">
                + Sobreflujo
              </button>
            </div>

            {/* Grid de 6 Tarjetas de Métricas (3x2) */}
            <div className="grid grid-cols-3 gap-2 text-center">
              <div onClick={() => setFilter('ALL')} className={`bg-[#151221] p-2.5 rounded-2xl border ${filter === 'ALL' ? 'border-purple-500' : 'border-purple-900/30'} cursor-pointer`}>
                <span className="text-[10px] text-zinc-400 font-bold block">Capacidad Total</span>
                <span className="text-base font-black text-white">{stats.total}</span>
                <div className="w-full bg-zinc-800 h-1 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-purple-600 h-full w-full"></div>
                </div>
              </div>

              <div onClick={() => setFilter('AVAILABLE')} className={`bg-[#151221] p-2.5 rounded-2xl border ${filter === 'AVAILABLE' ? 'border-emerald-500' : 'border-purple-900/30'} cursor-pointer`}>
                <span className="text-[10px] text-emerald-400 font-bold block">Disponibles</span>
                <span className="text-base font-black text-emerald-400">{stats.available}</span>
                <div className="w-full bg-zinc-800 h-1 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-emerald-500 h-full" style={{ width: `${(stats.available / stats.total) * 100}%` }}></div>
                </div>
              </div>

              <div onClick={() => setFilter('OCCUPIED')} className={`bg-[#151221] p-2.5 rounded-2xl border ${filter === 'OCCUPIED' ? 'border-blue-500' : 'border-purple-900/30'} cursor-pointer`}>
                <span className="text-[10px] text-blue-400 font-bold block">Ocupados</span>
                <span className="text-base font-black text-blue-400">{stats.occupied}</span>
                <div className="w-full bg-zinc-800 h-1 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-blue-600 h-full" style={{ width: `${(stats.occupied / stats.total) * 100}%` }}></div>
                </div>
              </div>

              <div onClick={() => setFilter('WORKING')} className={`bg-[#151221] p-2.5 rounded-2xl border ${filter === 'WORKING' ? 'border-cyan-500' : 'border-purple-900/30'} cursor-pointer`}>
                <span className="text-[10px] text-cyan-400 font-bold block">Descargando</span>
                <span className="text-base font-black text-cyan-400">{stats.working}</span>
                <div className="w-full bg-zinc-800 h-1 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-cyan-500 h-full" style={{ width: `${(stats.working / stats.total) * 100}%` }}></div>
                </div>
              </div>

              <div onClick={() => setFilter('DISCREPANCY')} className={`bg-[#151221] p-2.5 rounded-2xl border ${filter === 'DISCREPANCY' ? 'border-amber-500' : 'border-purple-900/30'} cursor-pointer`}>
                <span className="text-[10px] text-amber-400 font-bold block">Discrepancias</span>
                <span className="text-base font-black text-amber-400">{stats.discrepancy}</span>
                <div className="w-full bg-zinc-800 h-1 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-amber-500 h-full" style={{ width: `${(stats.discrepancy / stats.total) * 100}%` }}></div>
                </div>
              </div>

              <div onClick={() => setFilter('DISABLED')} className={`bg-[#151221] p-2.5 rounded-2xl border ${filter === 'DISABLED' ? 'border-zinc-400' : 'border-purple-900/30'} cursor-pointer`}>
                <span className="text-[10px] text-zinc-300 font-bold block">Inhabilitadas</span>
                <span className="text-base font-black text-zinc-200">{stats.disabled}</span>
                <div className="w-full bg-zinc-800 h-1 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-zinc-400 h-full" style={{ width: `${(stats.disabled / stats.total) * 100}%` }}></div>
                </div>
              </div>
            </div>

            {/* Botones de Filtro Inferior (Todos, Ocupados, Libres, etc.) */}
            <div className="flex gap-1.5 overflow-x-auto pb-1 text-xs font-bold scrollbar-none">
              <button onClick={() => setFilter('ALL')} className={`px-4 py-2 rounded-2xl whitespace-nowrap transition ${filter === 'ALL' ? 'bg-purple-600 text-white shadow-md' : 'bg-[#151221] text-zinc-400 border border-purple-900/30'}`}>Todos</button>
              <button onClick={() => setFilter('OCCUPIED')} className={`px-4 py-2 rounded-2xl whitespace-nowrap transition ${filter === 'OCCUPIED' ? 'bg-purple-600 text-white shadow-md' : 'bg-[#151221] text-zinc-400 border border-purple-900/30'}`}>Ocupados</button>
              <button onClick={() => setFilter('AVAILABLE')} className={`px-4 py-2 rounded-2xl whitespace-nowrap transition ${filter === 'AVAILABLE' ? 'bg-purple-600 text-white shadow-md' : 'bg-[#151221] text-zinc-400 border border-purple-900/30'}`}>Libres</button>
              <button onClick={() => setFilter('WORKING')} className={`px-4 py-2 rounded-2xl whitespace-nowrap transition ${filter === 'WORKING' ? 'bg-purple-600 text-white shadow-md' : 'bg-[#151221] text-zinc-400 border border-purple-900/30'}`}>Descargando</button>
              <button onClick={() => setFilter('DISABLED')} className={`px-4 py-2 rounded-2xl whitespace-nowrap transition ${filter === 'DISABLED' ? 'bg-purple-600 text-white shadow-md' : 'bg-[#151221] text-zinc-400 border border-purple-900/30'}`}>Bloqueadas</button>
            </div>

            {/* Matriz Visual Principal */}
            <div className="bg-[#151221] p-3.5 rounded-2xl border border-purple-900/40 space-y-3 shadow-lg">
              <div className="flex justify-between items-center border-b border-purple-900/30 pb-2">
                <h2 className="font-extrabold text-xs text-purple-200 uppercase tracking-wider">
                  BUILDING {building} — {zone === 'DOCK' ? 'RAMPAS / DOCKS' : 'YARDA / PATIO'} ({displayedItems.length})
                </h2>
                <span className="text-[10px] text-zinc-400">Toca para editar</span>
              </div>

              <div className="grid grid-cols-6 gap-1.5">
                {displayedItems.map(loc => {
                  let bg = 'bg-emerald-600';
                  if (loc.status === 'OCCUPIED_LOADED') bg = 'bg-red-600';
                  else if (loc.status === 'OCCUPIED_EMPTY') bg = 'bg-cyan-500 text-slate-950';
                  else if (loc.status === 'WORKING') bg = 'bg-blue-600';
                  else if (loc.status === 'DISCREPANCY') bg = 'bg-amber-500 text-slate-950';
                  else if (loc.status === 'DISABLED') bg = 'bg-zinc-300 text-zinc-900';

                  return (
                    <button
                      key={loc.id}
                      onClick={() => setEditingLoc(loc)}
                      className={`${bg} rounded-xl p-1.5 h-14 flex flex-col items-center justify-between font-bold shadow-md active:scale-95 transition`}
                    >
                      <span className="text-xs font-black">{loc.number}</span>
                      <span className="text-[8px] truncate max-w-full bg-black/40 px-1 rounded text-white">
                        {loc.trailer || 'LIBRE'}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Modal de Edición */}
            {editingLoc && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <form onSubmit={handleSave} className="bg-[#1b1532] border border-purple-500 rounded-3xl max-w-xs w-full p-4 space-y-3 shadow-2xl">
                  <h3 className="font-extrabold text-sm text-purple-200">Editar {zone === 'DOCK' ? 'Rampa' : 'Yarda'} {editingLoc.number}</h3>
                  <div>
                    <label className="text-[11px] text-zinc-300 block mb-1 font-semibold">Trailer #:</label>
                    <input name="trailer" defaultValue={editingLoc.trailer} placeholder="Ej. TRL-8842" className="w-full bg-[#0c0a12] border border-zinc-700 rounded-xl p-2.5 text-xs font-bold uppercase text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div>
                      <label className="text-zinc-300 block mb-1 font-semibold">Estado:</label>
                      <select name="status" defaultValue={editingLoc.status} className="w-full bg-[#0c0a12] border border-zinc-700 rounded-xl p-2.5 text-white font-medium">
                        <option value="AVAILABLE">Disponible</option>
                        <option value="OCCUPIED_LOADED">Cargado</option>
                        <option value="OCCUPIED_EMPTY">Vacío (MX)</option>
                        <option value="WORKING">Descargando</option>
                        <option value="DISCREPANCY">Discrepancia</option>
                        <option value="DISABLED">Inhabilitada</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-zinc-300 block mb-1 font-semibold">Carga:</label>
                      <select name="loadState" defaultValue={editingLoc.loadState} className="w-full bg-[#0c0a12] border border-zinc-700 rounded-xl p-2.5 text-white font-medium">
                        <option value="LOADED">Cargado</option>
                        <option value="EMPTY">Vacío</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setEditingLoc(null)} className="flex-1 bg-zinc-800 py-2.5 rounded-2xl text-xs font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 bg-purple-600 hover:bg-purple-500 py-2.5 rounded-2xl text-xs font-bold shadow-lg shadow-purple-600/30">Guardar</button>
                  </div>
                </form>
              </div>
            )}

            {/* Modal de Sobreflujo */}
            {overflowModal && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  setOverflowList([...overflowList, { id: Date.now(), trailer: fd.get('trailer').toUpperCase(), pos: fd.get('pos') }]);
                  setOverflowModal(false);
                }} className="bg-[#1b1532] border border-amber-500 rounded-3xl max-w-xs w-full p-4 space-y-3 shadow-2xl">
                  <h3 className="font-extrabold text-sm text-amber-400">Registrar Sobreflujo</h3>
                  <div>
                    <label className="text-[11px] text-zinc-300 block mb-1 font-semibold">Trailer #:</label>
                    <input name="trailer" required placeholder="Ej. TRL-9912" className="w-full bg-[#0c0a12] border border-zinc-700 rounded-xl p-2.5 text-xs font-bold uppercase text-white" />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-300 block mb-1 font-semibold">Ubicación de referencia:</label>
                    <input name="pos" required placeholder="Ej. Frente a Rampa 12" className="w-full bg-[#0c0a12] border border-zinc-700 rounded-xl p-2.5 text-xs font-semibold text-white" />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setOverflowModal(false)} className="flex-1 bg-zinc-800 py-2.5 rounded-2xl text-xs font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 bg-amber-500 text-slate-950 hover:bg-amber-400 py-2.5 rounded-2xl text-xs font-black shadow-lg">Guardar</button>
                  </div>
                </form>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
