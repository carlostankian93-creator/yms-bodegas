<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMS Mobile & Dock Control</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0a0e] text-white font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [building, setBuilding] = React.useState(4);
        const [zone, setZone] = React.useState('DOCK');
        const [locations, setLocations] = React.useState(() => {
          const saved = localStorage.getItem('yms_app_data');
          if (saved) return JSON.parse(saved);
          const locs = [];
          for (let i = 1; i <= 44; i++) {
            locs.push({ id: `B4-D-${i}`, building: 4, zone: 'DOCK', number: i, status: i % 3 === 0 ? 'AVAILABLE' : 'OCCUPIED_LOADED', trailer: i % 3 === 0 ? '' : `TRL-${1000 + i}`, loadState: 'LOADED' });
          }
          for (let i = 1001; i <= 1038; i++) {
            locs.push({ id: `B5-D-${i}`, building: 5, zone: 'DOCK', number: i, status: 'AVAILABLE', trailer: '', loadState: 'EMPTY' });
          }
          return locs;
        });
        const [editingLoc, setEditingLoc] = React.useState(null);

        React.useEffect(() => {
          localStorage.setItem('yms_app_data', JSON.stringify(locations));
        }, [locations]);

        const currentItems = locations.filter(l => l.building === building && l.zone === zone);

        const handleSave = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const trailer = fd.get('trailer').trim().toUpperCase();
          const loadState = fd.get('loadState');
          const status = trailer ? 'OCCUPIED_LOADED' : 'AVAILABLE';

          const updated = locations.map(l => l.id === editingLoc.id ? { ...l, trailer, loadState, status } : l);
          setLocations(updated);
          setEditingLoc(null);
        };

        return (
          <div className="min-h-screen bg-[#0b0a0e] text-white p-3 max-w-md mx-auto space-y-3">
            {/* Header */}
            <div className="flex items-center justify-between bg-[#151221] p-3 rounded-2xl border border-purple-900/40">
              <div className="flex items-center gap-2">
                <div className="bg-purple-600 p-2 rounded-xl text-sm font-bold">🚛</div>
                <span className="font-extrabold text-base">YMS Mobile</span>
              </div>
              <div className="bg-[#1f1a30] px-3 py-1.5 rounded-xl text-xs font-bold text-purple-300 border border-purple-800">
                Bodega {building}
              </div>
            </div>

            {/* Selectores de Bodega */}
            <div className="grid grid-cols-2 gap-2 bg-[#151221] p-1.5 rounded-2xl border border-purple-900/40">
              <button onClick={() => setBuilding(4)} className={`py-2 rounded-xl font-bold text-xs ${building === 4 ? 'bg-purple-600 text-white' : 'text-zinc-400'}`}>
                BODEGA 4 (1-44)
              </button>
              <button onClick={() => setBuilding(5)} className={`py-2 rounded-xl font-bold text-xs ${building === 5 ? 'bg-purple-600 text-white' : 'text-zinc-400'}`}>
                BODEGA 5 (1001-1038)
              </button>
            </div>

            {/* Matriz */}
            <div className="bg-[#151221] p-3.5 rounded-2xl border border-purple-900/40 space-y-3">
              <h2 className="font-extrabold text-xs text-purple-200 uppercase tracking-wider">
                BODEGA {building} — RAMPAS ({currentItems.length})
              </h2>
              <div className="grid grid-cols-6 gap-1.5">
                {currentItems.map(loc => {
                  const bg = loc.status === 'AVAILABLE' ? 'bg-emerald-600' : 'bg-red-600';
                  return (
                    <button
                      key={loc.id}
                      onClick={() => setEditingLoc(loc)}
                      className={`${bg} rounded-xl p-1.5 h-14 flex flex-col items-center justify-between text-white font-bold shadow active:scale-95 transition`}
                    >
                      <span className="text-xs font-black">{loc.number}</span>
                      <span className="text-[8px] truncate max-w-full bg-black/40 px-1 rounded">
                        {loc.trailer || 'LIBRE'}
                      </span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Modal */}
            {editingLoc && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                <form onSubmit={handleSave} className="bg-[#1b1532] border border-purple-500 rounded-2xl max-w-xs w-full p-4 space-y-3 shadow-2xl">
                  <h3 className="font-bold text-sm text-purple-200">Editar Rampa {editingLoc.number}</h3>
                  <div>
                    <label className="text-[11px] text-zinc-300 block mb-1">Trailer # (Dejar vacío si está libre):</label>
                    <input name="trailer" defaultValue={editingLoc.trailer} placeholder="Ej. TRL-8842" className="w-full bg-[#0c0a12] border border-zinc-700 rounded-lg p-2 text-xs font-bold uppercase text-white" />
                  </div>
                  <div>
                    <label className="text-[11px] text-zinc-300 block mb-1">Estado de Carga:</label>
                    <select name="loadState" defaultValue={editingLoc.loadState} className="w-full bg-[#0c0a12] border border-zinc-700 rounded-lg p-2 text-xs text-white">
                      <option value="LOADED">CARGADO</option>
                      <option value="EMPTY">VACÍO (Chofer MX)</option>
                    </select>
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setEditingLoc(null)} className="flex-1 bg-zinc-800 py-2 rounded-xl text-xs font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 bg-purple-600 py-2 rounded-xl text-xs font-bold">Guardar</button>
                  </div>
                </form>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
